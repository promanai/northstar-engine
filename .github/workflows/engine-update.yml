name: Engine update
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-update
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_update: ${{ steps.plan.outputs.has_update }}
      plan: ${{ steps.plan.outputs.plan }}
      repository: ${{ steps.plan.outputs.repository }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: plan
        run: node scripts/update-runner.mjs plan
        env:
          ENGINE_SITE_URL: ${{ vars.ENGINE_SITE_URL }}
          UPDATE_RUNNER_SECRET: ${{ secrets.UPDATE_RUNNER_SECRET }}
  build:
    needs: plan
    if: needs.plan.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.plan.outputs.repository }}
          ref: ${{ needs.plan.outputs.sha }}
          path: source
          persist-credentials: false
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No Cloudflare or runner secrets in the build job.
      - run: npm ci
        working-directory: source
      - run: npm audit --audit-level=high
        working-directory: source
      - run: npm test && npm run lint && npx tsc --noEmit && npm run build && npm run test:integration && npm run test:lite
        working-directory: source
        env:
          ENGINE_BUILD_VERSION: ${{ needs.plan.outputs.version }}
          ENGINE_BUILD_REPOSITORY: ${{ needs.plan.outputs.repository }}
          ENGINE_BUILD_SHA: ${{ needs.plan.outputs.sha }}
      - run: node control/scripts/update-runner.mjs package
        env:
          UPDATE_PLAN: ${{ needs.plan.outputs.plan }}
      - uses: actions/upload-artifact@v4
        with:
          name: engine-update-bundle
          path: update-bundle/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
  deploy:
    needs: [plan, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: control
      - run: npm audit --audit-level=high
        working-directory: control
      - uses: actions/download-artifact@v4
        with:
          name: engine-update-bundle
          path: update-bundle
      - run: node control/scripts/update-runner.mjs deploy
        env:
          UPDATE_PLAN: ${{ needs.plan.outputs.plan }}
          ENGINE_SITE_URL: ${{ vars.ENGINE_SITE_URL }}
          UPDATE_RUNNER_SECRET: ${{ secrets.UPDATE_RUNNER_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  report:
    needs: [plan, build, deploy]
    if: always() && needs.plan.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/update-runner.mjs report
        env:
          UPDATE_PLAN: ${{ needs.plan.outputs.plan }}
          UPDATE_RESULT: ${{ needs.deploy.result }}
          ENGINE_SITE_URL: ${{ vars.ENGINE_SITE_URL }}
          UPDATE_RUNNER_SECRET: ${{ secrets.UPDATE_RUNNER_SECRET }}
